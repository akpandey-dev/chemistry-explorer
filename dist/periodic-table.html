<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Periodic Table</title>

    <style>
* {
    box-sizing: border-box;
    padding: 0;
    margin: 0;
}

body {
    background: #d7fff1;
    height: auto;
    min-height: 100vh;
    width: 90vw;
    margin: auto;
    padding: 5px;
    font-family: Arial, sans-serif;
    scrollbar-width: none;
    color: #222;
}


h1{
    text-align:center;
}


hr {
    align-self: stretch;
    border: none;
    border-top: 1px solid #666;
    margin: 15px 0;
}

#periodic-table{
  display: grid;
  grid-template-columns: repeat(18, 1fr);
  gap: 6px;
  padding: 10px;
  justify-items: center;
  max-width: 95%;
  margin: 20px auto;
}

.periodic-element{
  background: black;
  border: 1px solid rgb(245, 7, 7);
  color: #d7fff1;
  border-radius: 8px;
  padding: 8px;
  width: 55px;
  height: 55px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: 0.2s;
  cursor: pointer;
  position: relative;
}

.periodic-element .period-label,
.periodic-element .group-label {
  position: absolute;
  font-size: 0.5rem;
  color: #d7fff1;
  opacity: 0.9;
}

.periodic-element .period-label {
  left: 1px;
}

.periodic-element .group-label {
  top: 2px;
  left: 0px;
}


.symbol {
  font-size: 1.3rem;
  font-weight: bold;
  color: #d7fff1;
}

.number {
  font-size: 0.8rem;
  opacity: 0.8;
  color: #d7fff1;
}

.name {
  font-size: 0.7rem;
  opacity: 0.8;
  color: #d7fff1;
}

.periodic-element:hover {
  transform: scale(1.08);
  border-color: rgb(1, 1, 1);
  background-color: white;
}

.periodic-element:hover .name{
      color: #111;
}
.periodic-element:hover .number{
      color: #111;
}
.periodic-element:hover .symbol{
      color: #111;
}
.periodic-element:hover .period-label{
      color: #111;
}
.periodic-element:hover .group-label{
      color: #111;
}

@media (max-width: 1200px) {
  #periodic-table {
    grid-template-columns: repeat(12, 1fr);
  }
}

@media (max-width: 900px) {
  #periodic-table {
    grid-template-columns: repeat(8, 1fr);
  }
  .periodic-element {
    width: 60px;
    height: 60px;
  }
}

@media (max-width: 600px) {
  #periodic-table {
    grid-template-columns: repeat(5, 1fr);
  }
  .periodic-element {
    width: 55px;
    height: 55px;
  }
  .symbol {
    font-size: 1.1rem;
  }
  .name {
  font-size: 0.6rem;

}
}

@media (max-width: 400px) {
  #periodic-table {
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
  }
  .periodic-element {
    width: 42px;
    height: 42px;
    padding: 6px;
  }
  .symbol {
    font-size: 1rem;
  }
  .number {
    font-size: 0.8rem;
  }
  .name {
  font-size: 0.5rem;
}
}

#guide {
    display: flex;
    flex-direction: column;
    width: 100%;
    border: 2px dotted red;
    padding: 10px;
    font-size: 0.8rem;
    align-items: center;
}

#guide dt{
    border: 1px solid red;
    border-bottom: none;
    border-top-right-radius: 8px;
}
#guide dd{
    border: 1px solid red;
    border-top: none;
    border-bottom-left-radius: 8px;
}


.element-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.element-symbol {
    font-size: 2rem;
    font-weight: bold;
    color: #2c7ef7;
}

.element-number {
    font-size: 0.95rem;
    color: #666;
}

.element-name {
    font-size: 1.2rem;
    font-weight: bold;
    margin-bottom: 14px;
}

.element-info {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 5px 10px;
    overflow-x: auto;
    scrollbar-width: thin;
    white-space: nowrap;
}

.element-info::-webkit-scrollbar{
    width: 10px;
}

.element-info strong {
    color: #155;
}




.element-popup{
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background: rgba(0, 0, 0, 0.4);
  backdrop-filter: blur(3px);
  justify-content:center;
  align-items:center;
  z-index:999;
}

#element-popup-content{
    background:white;
    border-radius:8px;
    padding:10px;
    border:1px solid rgba(0,0,0,.15);
    box-shadow:0 6px 20px rgba(0,0,0,.08);
    width:min(600px,90vw);
    max-height:90vh;
    overflow-y:auto;
    scrollbar-width:thin;
}
</style>
</head>

<body>

    <h1>Periodic Table</h1>

    <hr>

    <div id="periodic-table"></div>

    <div id="guide">
        <strong>Each element cell contains:</strong>
        <br><br>
            <dl>
            <dt><b>Symbol</b></dt>
            <dd>- The bold letters in the center</dd>
            <dt><b>Name</b></dt>
            <dd>- Below Symbols</dd>
            <dt><b>Atomic Number</b></dt>
            <dd>- Above Symbols</dd>
            <dt><b>Group Label</b></dt>
            <dd>- The integer at the top left corner</dd>
            <dt><b>Period Label</b></dt>
            <dd>- Below Group Label</dd>
            </dl>
    </div>

    <div class="element-popup" id="element-popup">
        <div id="element-popup-content">
        </div>
    </div>

    <script>
let elements = [];

async function loadElements() {
    try {
        const response = await fetch("https://raw.githubusercontent.com/akp-labs/periodic-table/main/src/data/element-data.json");
        elements = await response.json();
        renderPeriodicTable(elements);
    } catch (error) {
        console.error("Error loading element data:", error);
    }
}
loadElements();

// Most of the data above is AI generated and can contain inaccuracies



const periodicTable = document.getElementById("periodic-table");
const selectedElement = document.getElementById("selected-element");


function renderPeriodicTable(allElements) {

    periodicTable.innerHTML = "";
    allElements.forEach((element) => {

        const cell = document.createElement("div");
        cell.className = "periodic-element";
        cell.dataset.element = element.id;
        cell.innerHTML = `
      <div class="period-label">${element.period}</div>
      <div class="group-label">${element.group}</div>
      <div class="number">${element.atomicNumber}</div>
      <div class="symbol">${element.symbol}</div>
      <div class="name">${element.name}</div>      
        `;

        periodicTable.appendChild(cell);

        cell.addEventListener("contextmenu", (e) => {
            e.preventDefault();
            openPopup(element);
        });

        let pressTimer;
        cell.addEventListener("touchstart", () => {
            pressTimer = setTimeout(() => openPopup(element), 900);
        });
        cell.addEventListener("touchend", () => clearTimeout(pressTimer));
        cell.addEventListener("touchmove", () => clearTimeout(pressTimer));


    });}


const popup = document.getElementById("element-popup");
const popupContent = document.getElementById("element-popup-content");


popup.addEventListener("click", (event) => {
  if (event.target === popup) popup.style.display = "none";
  document.body.style.overflow = "auto";
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    popup.style.display = "none";
    document.body.style.overflow = "auto";
  }
});

function openPopup(el) {
  document.body.style.overflow = "hidden";
  popupContent.innerHTML = `
  ${createElementCard(el)}
  `;
  popup.style.display = "flex";
  popupContent.style.overflowX = "auto";
}


function createElementCard(element) {

    return `

        <div class="element-header">
        <div class="element-symbol">
            ${element.symbol}
        </div>
        <div class="element-number">
            #${element.atomicNumber}
        </div>
        </div>
        <div class="element-name">
            ${element.name}
        </div>

        <div class="element-info">

          <strong>Group</strong>
          <span>${element.group ?? "-"}</span>

          <strong>Period</strong>
          <span>${element.period ?? "-"}</span>

          <strong>Block</strong>
          <span>${element.block ?? "-"}</span>

          <strong>Valency</strong>
          <span>${element.valency ?? "-"}</span>

          <strong>Atomic Mass</strong>
          <span>${element.atomicMass ?? "-"}</span>

          <strong>Neutrons</strong>
          <span>${element.neutrons ?? "-"}</span>

        </div>
        
        <hr>


<details>

<summary>More Information</summary>

<div class="element-info">

<strong>Category</strong>
<span>${element.category ?? "-"}</span>

<strong>Phase</strong>
<span>${element.phase ?? "-"}</span>

<strong>Standard State</strong>
<span>${element.standardState ?? "-"}</span>

<strong>Color</strong>
<span>${element.color ?? "-"}</span>

<strong>Electron Configuration</strong>
<span>${element.electronConfiguration ?? "-"}</span>

<strong>Oxidation States</strong>
<span>${element.oxidationStates ?? "-"}</span>

<strong>Ionization Energy</strong>
<span>${element.ionizationEnergy ?? "-"}</span>

<strong>Electron Affinity</strong>
<span>${element.electronAffinity ?? "-"}</span>

<strong>Atomic Radius</strong>
<span>${element.atomicRadius ?? "-"}</span>

<strong>Ionic Radius</strong>
<span>${element.ionicRadius ?? "-"}</span>

<strong>Covalent Radius</strong>
<span>${element.covalentRadius ?? "-"}</span>

<strong>Density</strong>
<span>${element.density ?? "-"}</span>

<strong>Melting Point</strong>
<span>${element.meltingPoint ?? "-"}</span>

<strong>Boiling Point</strong>
<span>${element.boilingPoint ?? "-"}</span>

<strong>Bonding Type</strong>
<span>${element.bondingType ?? "-"}</span>

<strong>Crystal Structure</strong>
<span>${element.crystalStructure ?? "-"}</span>

<strong>Natural Occurrence</strong>
<span>${element.naturalOccurrence ?? "-"}</span>

<strong>Radioactive</strong>
<span>${element.radioactive ?? "-"}</span>

<strong>Toxicity</strong>
<span>${element.toxicity ?? "-"}</span>

<strong>Uses</strong>
<span>${element.uses ?? "-"}</span>

<strong>Isotopes</strong>
<span>${element.isotopes ?? "-"}</span>

<strong>Atomicity</strong>
<span>${element.atomicity ?? "-"}</span>

<strong>Molecular Mass</strong>
<span>${element.molecularMass ?? "-"}</span>

<strong>Discovery Year</strong>
<span>${element.discoveryYear ?? "-"}</span>

<strong>Discovered By</strong>
<span>${element.discoveredBy ?? "-"}</s</div>

</details>

    `;
  }





</script>

</body>

</html>
