<style>

body {
    font-family: Arial, sans-serif;
    background: #d7fff1;
    margin: 24px;
    line-height: 1.5;
    color: #222;
}

nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    margin: 20px 0;
}

nav a {
    text-decoration: none;
    color: #155;
    background: rgba(255,255,255,.5);
    border: 1px solid rgba(0,0,0,.15);
    padding: 4px 8px;
    border-radius: 6px;
    transition: .2s;
}

nav a:hover {
    background: #2c7ef7;
    color: white;
}

h1{
    text-align:center;
}


hr {
    align-self: stretch;
    border: none;
    border-top: 1px solid #666;
    margin: 15px 0;
}

#periodic-table{
    width: 100%;
    margin-top: 20px;
}

#elements {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px;
    margin-top: 20px;
}

.element-card {
    background: white;
    border-radius: 8px;
    padding: 10px;
    border: 1px solid rgba(0,0,0,.15);
    box-shadow: 0 6px 20px rgba(0,0,0,.08);
    transition: .2s;
}

.element-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 30px rgba(0,0,0,.15);
}

.element-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.element-symbol {
    font-size: 2rem;
    font-weight: bold;
    color: #2c7ef7;
}

.element-number {
    font-size: 0.95rem;
    color: #666;
}

.element-name {
    font-size: 1.2rem;
    font-weight: bold;
    margin-bottom: 14px;
}

.element-info {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 5px 10px;
}

.element-info strong {
    color: #155;
}


@keyframes highlight {
    from {
        box-shadow: 0 0 0 4px gold, 0 6px 20px rgba(0, 0, 0, 0.08);
    }

    to {
        box-shadow: 0 6px 20px rgba(0 ,0 ,0 , 0.08);
    }
}

.highlight-card {
    animation: highlight 1.5s ease;
}

.navigation{
    border: 1px solid #d7fff1;
    border-radius: 8px;
    margin: 10px;
    transition: 1s;
    box-shadow: 2px 2px 2px black;
}

.navigation:hover{
        border: 1px solid #58f8c0;
}

</style>
</head>

const nav = document.getElementById("nav");
const container = document.getElementById("elements");

for (const element of elements) {

    nav.innerHTML += `<a href="#${element.id}">${element.symbol}</a>\n`;

container.innerHTML += `
<div class="element-card" id="${element.id}">
    <div class="element-header">
        <div class="element-symbol">${element.symbol}</div>
        <div class="element-number">#${element.atomicNumber}</div>
    </div>

    <div class="element-name">${element.name}</div>

    <div class="element-info">
        <strong>Group</strong><span>${element.group ?? "-"}</span>
        <strong>Period</strong><span>${element.period}</span>
        <strong>Block</strong><span>${element.block}</span>
        <strong>Valency</strong><span>${element.valency}</span>
        <strong>Atomic Mass</strong><span>${element.atomicMass}</span>
        <strong>Neutrons</strong><span>${element.neutrons}</span>
    </div>
</div>
`;
}

nav.addEventListener("click", (e) => {
    if (!e.target.matches("a")) return;
    e.preventDefault();

    const id = e.target.getAttribute("href").slice(1);
    const card = document.getElementById(id);

    card.scrollIntoView({
        behavior: "smooth",
        block: "center"
    });

    card.classList.remove("highlight-card");
    void card.offsetWidth;
    card.classList.add("highlight-card");
});

</script>
